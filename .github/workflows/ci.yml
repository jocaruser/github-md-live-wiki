name: CI

on:
  pull_request:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================
  # JOB 1: Lint
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: base
          push: false
          load: true
          tags: github-md-live-wiki-app:latest
          cache-from: type=gha

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

  # ============================================================
  # JOB 1b: Dependency audit (security gate — S2)
  # ============================================================
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: base
          push: false
          load: true
          tags: github-md-live-wiki-app:latest
          cache-from: type=gha

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Dependency vulnerability gate
        run: make audit

  # ============================================================
  # JOB 2: React Doctor (Code quality scanner)
  # ============================================================
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: base
          push: false
          load: true
          tags: github-md-live-wiki-app:latest
          cache-from: type=gha

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Allow git in container (CI owner mismatch)
        run: docker compose exec app git config --global --add safe.directory /app

      - name: React Doctor
        run: make react-doctor

  # ============================================================
  # JOB 3: Unit Tests (100% coverage thresholds)
  # ============================================================
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: base
          push: false
          load: true
          tags: github-md-live-wiki-app:latest
          cache-from: type=gha

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Unit tests
        run: make test

  # ============================================================
  # JOB 4: Build (TypeScript + Vite + production image + budget)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: base
          push: false
          load: true
          tags: github-md-live-wiki-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Bundle budget (P2)
        run: docker compose exec app node scripts/check-bundle-budget.mjs

      - name: Production image builds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: github-md-live-wiki:pr
          cache-from: type=gha

  # ============================================================
  # JOB 5: E2E Tests (offline; GitHub API mocked at the browser)
  # ============================================================
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: base
          push: false
          load: true
          tags: github-md-live-wiki-app:latest
          cache-from: type=gha

      - name: Build Playwright image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.playwright
          push: false
          load: true
          tags: github-md-live-wiki-playwright:latest
          cache-from: type=gha

      - name: Start services
        run: docker compose up -d --no-build

      - name: Install dependencies
        run: make install

      - name: E2E tests
        run: make e2e-test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # ============================================================
  # Auto-merge (depends on all quality jobs)
  # Same-repo branches only: fork PRs get a read-limited token and must not be auto-approved here.
  # ============================================================
  auto-merge:
    runs-on: ubuntu-latest
    needs: [lint, react-doctor, unit-test, build, e2e-test, audit]
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve dependabot pull request
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable merge-commit auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
