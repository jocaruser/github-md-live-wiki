name: Release

# Manual and deliberately infrequent: a release ships the wiki ENGINE (the
# static shell + container), never content — content repos always render live
# from GitHub. Consumers pin the major tag (e.g. :v1) so bugfix releases flow
# automatically and breaking changes require an explicit bump.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current version
        id: current
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check
        run: |
          if gh release view "v${{ steps.current.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ steps.current.outputs.version }}
            ${{ env.IMAGE }}:v${{ steps.current.outputs.major }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Detect changelog file
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          FILE="changelog/v${{ steps.current.outputs.version }}.md"
          if [ -f "$FILE" ]; then
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
          else
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release from changelog
        if: steps.check.outputs.exists == 'false' && steps.changelog.outputs.has_changelog == 'true'
        run: |
          gh release create "v${{ steps.current.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.current.outputs.version }}" \
            --notes-file "${{ steps.changelog.outputs.file }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with generated notes
        if: steps.check.outputs.exists == 'false' && steps.changelog.outputs.has_changelog != 'true'
        run: |
          gh release create "v${{ steps.current.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.current.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
